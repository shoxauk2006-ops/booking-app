<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-запись • Барбершоп</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #3b82f6;
            --border-color: #2e2e2e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
        }

        .step-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .step-title {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .option-btn {
            background: #262626;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: white;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
        }

        .option-btn.selected {
            border-color: var(--accent-color);
            background: #172554;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .time-btn {
            background: #262626;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .time-btn.selected {
            border-color: var(--accent-color);
            background: #172554;
        }

        .form-control {
            width: 100%;
            background: #262626;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✂️ Барбершоп «Black & White»</h1>

    <!-- Выбор услуги -->
    <div class="step-box">
        <div class="step-title">1. Выберите услугу</div>
        <div class="options-grid">
            <div class="option-btn" onclick="selectService(this, 'Мужская стрижка', '80 000 UZС')">
                <span>Мужская стрижка (30 мин)</span>
                <b>80 000 UZS</b>
            </div>
            <div class="option-btn" onclick="selectService(this, 'Оформление бороды', '40 000 UZS')">
                <span>Оформление бороды (20 мин)</span>
                <b>40 000 UZS</b>
            </div>
        </div>
    </div>

    <!-- Выбор времени -->
    <div class="step-box">
        <div class="step-title">2. Выберите время</div>
        <div class="time-grid">
            <div class="time-btn" onclick="selectTime(this, '10:00')">10:00</div>
            <div class="time-btn" onclick="selectTime(this, '12:00')">12:00</div>
            <div class="time-btn" onclick="selectTime(this, '14:00')">14:00</div>
            <div class="time-btn" onclick="selectTime(this, '16:00')">16:00</div>
            <div class="time-btn" onclick="selectTime(this, '18:00')">18:00</div>
            <div class="time-btn" onclick="selectTime(this, '20:00')">20:00</div>
        </div>
    </div>

    <!-- Контакты клиента -->
    <div class="step-box">
        <div class="step-title">3. Ваши данные</div>
        <div style="margin-bottom: 10px;">
            <label style="font-size: 13px; color: var(--text-secondary);">Ваше имя:</label>
            <input type="text" id="clientName" class="form-control" placeholder="Иван" oninput="checkForm()">
        </div>
        <div>
            <label style="font-size: 13px; color: var(--text-secondary);">Номер телефона:</label>
            <input type="tel" id="clientPhone" class="form-control" placeholder="+998 90 123 45 67" oninput="checkForm()">
        </div>
    </div>

</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let booking = {
        service: null,
        price: null,
        time: null,
        name: '',
        phone: ''
    };

    function selectService(element, name, price) {
        document.querySelectorAll('.step-box:nth-child(2) .option-btn').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        booking.service = name;
        booking.price = price;
        checkForm();
    }

    function selectTime(element, time) {
        document.querySelectorAll('.time-btn').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        booking.time = time;
        checkForm();
    }

    function checkForm() {
        booking.name = document.getElementById('clientName').value.trim();
        booking.phone = document.getElementById('clientPhone').value.trim();

        if (booking.service && booking.time && booking.name && booking.phone) {
            tg.MainButton.text = "Забронировать визит";
            tg.MainButton.color = "#22c55e";
            tg.MainButton.show();
        } else {
            tg.MainButton.hide();
        }
    }

   tg.MainButton.onClick(function() {
        // Формируем текст для отправки боту
        const data = JSON.stringify({
            service: booking.service,
            price: booking.price,
            time: booking.time,
            name: booking.name,
            phone: booking.phone
        });

        // Отправляем данные в Telegram-бот и закрываем мини-приложение
        tg.sendData(data);
    });
    tg.sendData(data);
});
