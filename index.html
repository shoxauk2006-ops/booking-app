<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Барбершоп «Black & White»</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #ffffff;
            --border-color: #2e2e2e;
            --hover-border: #ffffff;
            --selected-border: #3b82f6;
            --selected-bg: #172554;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px; /* Отступ снизу для телеграм-кнопки */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-circle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #333333, #000000);
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            margin: 0 auto 12px auto;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .service-card:hover {
            border-color: var(--hover-border);
            background-color: #222222;
        }

        .service-card.selected {
            border-color: var(--selected-border);
            background-color: var(--selected-bg);
        }

        .service-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .service-name {
            font-size: 16px;
            font-weight: 500;
        }

        .service-duration {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .service-price {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-color);
            white-space: nowrap;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-circle">B&W</div>
            <h1>Барбершоп «Black & White»</h1>
            <div class="subtitle">✂️ Мужской зал • 📍 Ташкент</div>
        </div>

        <div class="section-title">Выберите услугу:</div>

        <div class="services-list">
            <div class="service-card" onclick="selectService(this, 'Мужская стрижка', '80 000 UZS')">
                <div class="service-info">
                    <span class="service-name">Мужская стрижка</span>
                    <span class="service-duration">⏱ 30 мин</span>
                </div>
                <div class="service-price">80 000 UZS</div>
            </div>

            <div class="service-card" onclick="selectService(this, 'Оформление бороды', '40 000 UZS')">
                <div class="service-info">
                    <span class="service-name">Оформление бороды</span>
                    <span class="service-duration">⏱ 20 мин</span>
                </div>
                <div class="service-price">40 000 UZS</div>
            </div>

            <div class="service-card" onclick="selectService(this, 'Стрижка + Борода', '110 000 UZS')">
                <div class="service-info">
                    <span class="service-name">Стрижка + Борода</span>
                    <span class="service-duration">⏱ 50 мин</span>
                </div>
                <div class="service-price">110 000 UZS</div>
            </div>
        </div>

        <div class="footer">
            @boockly_bot
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedService = null;

        function selectService(element, name, price) {
            // Убираем выделение со всех карточек
            document.querySelectorAll('.service-card').forEach(card => {
                card.classList.remove('selected');
            });

            // Выделяем текущую
            element.classList.add('selected');
            selectedService = { name, price };

            // Показываем стандартную крутую кнопку Telegram внизу экрана
            tg.MainButton.text = `Записаться: ${name} (${price})`;
            tg.MainButton.color = "#3b82f6";
            tg.MainButton.textColor = "#ffffff";
            tg.MainButton.show();
        }

        // Действие при нажатии на кнопку внизу Telegram
        tg.MainButton.onClick(function() {
            if (selectedService) {
                tg.showAlert(`Вы успешно выбрали:\n${selectedService.name} — ${selectedService.price}\n\nСпасибо за запись!`);
                // Здесь можно добавить закрытие приложения или отправку данных
                // tg.close();
            }
        });
    </script>
</body>
</html>
